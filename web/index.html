<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stickman Poser</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div id="toolbar">
    <div id="tools"></div>
    <div id="menu">
      <button id="menu-box" type="button"><span id="menu-label"></span><span class="arrow"></span></button>
      <input id="menu-search" type="text" autocomplete="off" spellcheck="false" hidden>
      <div id="menu-list" hidden></div>
    </div>
  </div>
  <div id="help" class="panel" hidden>
    <div class="title"></div><pre class="body"></pre><button class="ok" type="button">OK</button>
  </div>
  <div id="info" class="panel" hidden>
    <div class="title"></div><div class="body"></div><button class="ok" type="button">OK</button>
  </div>
  <div id="status" hidden></div>
  <div id="tooltip" hidden></div>
  <div id="loading"><div class="spinner"></div><span id="loading-text">Φόρτωση... / Loading...</span></div>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
